services:
  redis:
    container_name: nashvillest-redis
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always
  hubot:
    container_name: nashvillest-hubot
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://nashvillest-redis:6379
    depends_on:
      - redis
    restart: always

volumes:
  redis-data:
